<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1c20" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" />
  
  <!-- Geometric Sound Lattice -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" fill="none">
    <circle cx="400" cy="380" r="260" stroke-dasharray="4 8" />
    <circle cx="400" cy="380" r="210" />
    <circle cx="400" cy="380" r="160" stroke-opacity="0.25" />
    <circle cx="400" cy="380" r="110" />
    <circle cx="400" cy="380" r="60" stroke-opacity="0.4" />
  </g>
  
  <!-- Horizon Wave lines -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M 120 380 Q 260 220 400 380 T 680 380" />
    <path d="M 140 400 Q 270 260 400 400 T 660 400" opacity="0.5" />
    <path d="M 160 420 Q 280 300 400 420 T 640 420" opacity="0.25" />
  </g>
  <circle cx="400" cy="380" r="14" fill="#ffffff" />

  <text x="70" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="4" fill="#a1a1aa">HELLO MUSIC // 002</text>
  <text x="730" y="80" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#ffffff">REMIX EDITION</text>

  <g transform="translate(70, 620)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#a1a1aa">UNDERRATED GEM</text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="#ffffff">URE JAO</text>
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d4d4d8">ARTIST: ZION</text>
  </g>
</svg>
